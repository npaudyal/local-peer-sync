[package]
name = "local-peer-sync-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "local_peer_sync_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Real mDNS implementation
mdns-sd = "0.7"
if-addrs = "0.10"

# Networking
socket2 = "0.5"
uuid = { version = "1.6", features = ["v4"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Cryptography
ring = "0.17"
rand = "0.8"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# FFI
libc = "0.2"
async-trait = "0.1"


# Storage
sled = "0.34"
hostname = "0.3"
tempfile = "3.8"

# Premium Clipboard Features - iOS compatible versions
arboard = { version = "3.3", features = ["image-data"] }
image = { version = "0.24", features = ["png", "jpeg", "gif", "webp"] }
base64 = "0.21"
sha2 = "0.10"
mime_guess = "2.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"

# Compression - pure Rust alternative
lz4_flex = "0.11"

[dev-dependencies]
if-addrs = "0.10"

[package.metadata.ios]
deployment_target = "12.0"

[build-dependencies]
cc = "1.0"