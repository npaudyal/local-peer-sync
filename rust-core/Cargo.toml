[package]
name = "local-peer-sync-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "local_peer_sync_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
whoami = "1.4"

# Real mDNS implementation
mdns-sd = "0.7"
if-addrs = "0.10"

# Networking
socket2 = "0.5"
uuid = { version = "1.6", features = ["v4"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
urlencoding = "2.1"

# Cryptography
ring = "0.17"
rand = "0.8"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# FFI
libc = "0.2"
async-trait = "0.1"


# Storage
sled = "0.34"
hostname = "0.3"
tempfile = "3.8"

# Premium Clipboard Features - iOS compatible versions
arboard = { version = "3.3", features = ["image-data"] }
image = { version = "0.24", features = ["png", "jpeg", "gif", "webp"] }
base64 = "0.21"
sha2 = "0.10"
mime_guess = "2.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
md5 = "0.7"
# Compression - pure Rust alternative
lz4_flex = "0.11"

[dev-dependencies]
if-addrs = "0.10"
tempfile = "3.0"
tokio-test = "0.4"

[package.metadata.ios]
deployment_target = "12.0"

[build-dependencies]
cc = "1.0"

# File system and platform-specific
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "winuser", "shellapi", "objbase", "shobjidl", "combaseapi"
] }
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_UI_Shell",
    "Win32_System_DataExchange"
] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.24"
objc = "0.2"
core-foundation = "0.9"
core-graphics = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
x11-clipboard = "0.7"
arboard = "3.2"

# Add new module
[[bin]]
name = "file_transfer_demo"
path = "examples/file_transfer_demo.rs"

[[example]]
name = "file_transfer_demo"
path = "examples/file_transfer_demo.rs"