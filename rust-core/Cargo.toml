[package]
name = "local-peer-sync-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "local_peer_sync_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Real mDNS implementation (REPLACE the old mdns dependency)
mdns-sd = "0.7"          # Cross-platform mDNS/Bonjour
if-addrs = "0.10"        # Network interface discovery

# Networking
socket2 = "0.5"
uuid = { version = "1.6", features = ["v4"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Cryptography
ring = "0.17"
rand = "0.8"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# FFI
libc = "0.2"

# Storage
sled = "0.34"
hostname = "0.3"
tempfile = "3.8"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true